services:
  mysql:
    image: mysql:8.4
    container_name: devicestudio-mysql-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: device_history
      MYSQL_USER: device_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: UTC
    secrets:
      - mysql_app_password
    volumes:
      - mysql_lab_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/device-studio.cnf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u device_app --password="$$(cat /run/secrets/mysql_app_password)" --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

secrets:
  mysql_app_password:
    file: ./secrets/mysql_app_password

volumes:
  mysql_lab_data:
